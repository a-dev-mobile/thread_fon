name: Flutter Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decrypt files
        run: |
          mkdir -p env_dart
          # Расшифровка env_dart/prod.json.gpg
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.FILE_PASSPHRASE }}" \
          --output env_dart/prod.json env_dart/prod.json.gpg

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: "stable"
          cache: true

      - name: Install Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: |
          gem install fastlane
          gem install cocoapods

      - name: Flutter pub get
        run: flutter pub get
        
      - name: Generate code with build_runner
        run: dart run build_runner build --delete-conflicting-outputs --release
        
      # Prepare the Flutter iOS project
      - name: Prepare Flutter iOS project
        run: |
          # Ensure Flutter-generated files exist
          flutter precache --ios
          flutter pub get
          cd ios && flutter clean && cd ..
          flutter pub get
          
      # Run pod install
      - name: Run pod install
        run: cd ios && pod install
        
      - name: Setup Fastlane
        run: |
          # Create Fastlane directory if it doesn't exist
          mkdir -p ios/fastlane
          
          # Create Fastfile with automatic signing
          cat > ios/fastlane/Fastfile << 'EOF'
          default_platform(:ios)
          
          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # Update bundle identifier in project settings
              update_app_identifier(
                xcodeproj: "Runner.xcodeproj",
                plist_path: "Runner/Info.plist",
                app_identifier: ENV["BUNDLE_IDENTIFIER"]
              )
              
              # Update code signing settings to use automatic signing
              update_code_signing_settings(
                use_automatic_signing: true,
                path: "Runner.xcodeproj",
                team_id: ENV["DEVELOPMENT_TEAM"],
                bundle_identifier: ENV["BUNDLE_IDENTIFIER"]
              )
              
              # Build the app with automatic signing
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store",
                export_options: {
                  method: "app-store-connect",
                  teamID: ENV["DEVELOPMENT_TEAM"],
                  signingStyle: "automatic",
                  uploadSymbols: true,
                  stripSwiftSymbols: true
                },
                include_bitcode: false,
                include_symbols: true,
                output_name: "app-release.ipa"
              )
              
              # Upload to App Store Connect
              api_key = app_store_connect_api_key(
                key_id: ENV["APP_STORE_CONNECT_API_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                in_house: false
              )
              
              upload_to_testflight(
                api_key: api_key,
                skip_waiting_for_build_processing: true
              )
            end
          end
          EOF
          
          # Create Appfile
          cat > ios/fastlane/Appfile << EOF
          app_identifier("${{ secrets.BUNDLE_IDENTIFIER }}")
          team_id("${{ secrets.DEVELOPMENT_TEAM }}")
          EOF

      - name: Build and upload IPA with Fastlane
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Prepare Flutter for iOS release build
          flutter build ios --release --no-codesign --dart-define-from-file=env_dart/prod.json
          
          # Fix permissions for Fastlane
          chmod -R 755 ios
          
          # Run Fastlane
          cd ios && fastlane beta

      - name: Get commit info
        id: commit-info
        run: |
          echo "message=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: ios/app-release.ipa

      - name: Save IPA to releases folder
        id: save-ipa
        run: |
          # Создаем папку для релизов
          mkdir -p releases
          # Копируем IPA в папку releases с именем, содержащим commit hash
          cp ios/app-release.ipa releases/app-ios-${{ steps.commit-info.outputs.sha }}.ipa
          echo "filename=app-ios-${{ steps.commit-info.outputs.sha }}.ipa" >> $GITHUB_OUTPUT

      - name: Send Telegram notification with IPA
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🍏 Новая сборка iOS приложения
            
            Repo: ${{ github.repository }}
            Commit: ${{ steps.commit-info.outputs.sha }}
            Дата: ${{ steps.commit-info.outputs.date }}
            Сообщение: ${{ steps.commit-info.outputs.message }}
          document: ios/app-release.ipa