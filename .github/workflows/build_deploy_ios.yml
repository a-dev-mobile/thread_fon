name: Flutter Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decrypt files
        run: |
          mkdir -p ios/Runner
          mkdir -p private_keys
          
          # Decrypt certificates and profiles for iOS
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.FILE_PASSPHRASE }}" \
          --output ios/Runner/certificate.p12 ios/Runner/certificate.p12.gpg
          
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.FILE_PASSPHRASE }}" \
          --output ios/Runner/profile.mobileprovision ios/Runner/profile.mobileprovision.gpg
          
          # Decrypt App Store Connect API Key
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.FILE_PASSPHRASE }}" \
          --output private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8.gpg
          
          # Decrypt env_dart/prod.json.gpg
          mkdir -p env_dart
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.FILE_PASSPHRASE }}" \
          --output env_dart/prod.json env_dart/prod.json.gpg

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: "stable"
          cache: true

      - name: Install Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: |
          gem install fastlane
          gem install cocoapods

      - name: Flutter pub get
        run: flutter pub get
        
      - name: Generate code with build_runner
        run: dart run build_runner build --delete-conflicting-outputs --release
        
      # Prepare the Flutter iOS project
      - name: Prepare Flutter iOS project
        run: |
          # Ensure Flutter-generated files exist
          flutter precache --ios
          flutter pub get
          cd ios && flutter clean && cd ..
          flutter pub get
          
      # Run pod install
      - name: Run pod install
        run: cd ios && pod install
        
      - name: Setup Fastlane
        run: |
          # Create Fastlane directory if it doesn't exist
          mkdir -p ios/fastlane
          
          # Create Fastfile with the standard approach for certificate handling
          cat > ios/fastlane/Fastfile << 'EOF'
          default_platform(:ios)
          
          platform :ios do
            desc "Build IPA"
            lane :beta do
              # Create a temporary keychain
              keychain_name = "build_keychain"
              keychain_password = ENV["KEYCHAIN_PASSWORD"]
              
              delete_keychain(
                name: keychain_name
              ) if File.exist? File.expand_path("~/Library/Keychains/#{keychain_name}-db")
              
              create_keychain(
                name: keychain_name,
                password: keychain_password,
                default_keychain: true,
                unlock: true,
                timeout: 3600,
                add_to_search_list: true
              )
              
              # Import certificate and install provisioning profile
              import_certificate(
                certificate_path: "Runner/certificate.p12",
                certificate_password: ENV["P12_PASSWORD"],
                keychain_name: keychain_name,
                keychain_password: keychain_password,
                log_output: true
              )
              
              install_provisioning_profile(
                path: "Runner/profile.mobileprovision"
              )
              
              # Update bundle identifier and code signing settings
              update_app_identifier(
                xcodeproj: "Runner.xcodeproj",
                plist_path: "Runner/Info.plist",
                app_identifier: ENV["BUNDLE_IDENTIFIER"]
              )
              
              update_code_signing_settings(
                use_automatic_signing: false,
                path: "Runner.xcodeproj",
                team_id: ENV["DEVELOPMENT_TEAM"],
                profile_name: ENV["PROVISIONING_PROFILE"],
                code_sign_identity: ENV["CODE_SIGN_IDENTITY"],
                bundle_identifier: ENV["BUNDLE_IDENTIFIER"]
              )
              
              # Build the app
              build_app(
                workspace: "Runner.xcworkspace",
                scheme: "Runner",
                export_method: "app-store",
                export_options: {
                  provisioningProfiles: {
                    ENV["BUNDLE_IDENTIFIER"] => ENV["PROVISIONING_PROFILE"]
                  }
                },
                include_bitcode: false,
                include_symbols: true,
                output_name: "app-release.ipa"
              )
              
              # Clean up the keychain
              delete_keychain(
                name: keychain_name
              ) if File.exist? File.expand_path("~/Library/Keychains/#{keychain_name}-db")
            end
          end
          EOF
          
          # Create Appfile
          cat > ios/fastlane/Appfile << EOF
          app_identifier("${{ secrets.BUNDLE_IDENTIFIER }}")
          team_id("${{ secrets.DEVELOPMENT_TEAM }}")
          EOF

      - name: Build IPA with Fastlane
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
        run: |
          # Prepare Flutter for iOS release build
          flutter build ios --release --no-codesign --dart-define-from-file=env_dart/prod.json
          
          # Fix permissions for Fastlane
          chmod -R 755 ios
          
          # Run Fastlane (only builds IPA, no TestFlight upload)
          cd ios && fastlane beta
          
          # Create build directory if it doesn't exist
          mkdir -p build/ios/ipa
          cp ios/app-release.ipa build/ios/ipa/

      - name: Upload to TestFlight with xcrun altool
        run: |
          # Use xcrun altool to upload directly to App Store Connect
          xcrun altool --upload-app --type ios -f ios/app-release.ipa \
            --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            --verbose

      - name: Get commit info
        id: commit-info
        run: |
          echo "message=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: ios/app-release.ipa

      - name: Save IPA to releases folder
        id: save-ipa
        run: |
          # Create folder for releases
          mkdir -p releases
          # Copy IPA to releases folder with name containing commit hash
          cp ios/app-release.ipa releases/app-ios-${{ steps.commit-info.outputs.sha }}.ipa
          echo "filename=app-ios-${{ steps.commit-info.outputs.sha }}.ipa" >> $GITHUB_OUTPUT

      - name: Send Telegram notification with IPA
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🍏 New iOS app build
            
            Repo: ${{ github.repository }}
            Commit: ${{ steps.commit-info.outputs.sha }}
            Date: ${{ steps.commit-info.outputs.date }}
            Message: ${{ steps.commit-info.outputs.message }}
          document: ios/app-release.ipa