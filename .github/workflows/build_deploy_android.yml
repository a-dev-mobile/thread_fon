name: Android Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
    
env:
  FLUTTER_VERSION: "3.32.7"

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      # Подготовка окружения
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Расшифровка файлов
      - name: Decrypt secrets
        run: |
          mkdir -p android/app env_dart
          
          # Keystore для подписи
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.FILE_PASSPHRASE }}" \
          --output android/app/keystore.jks android/app/keystore.jks.gpg
          
          # Environment config
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.FILE_PASSPHRASE }}" \
          --output env_dart/prod.json env_dart/prod.json.gpg
          
          # Firebase config
          gpg --quiet --batch --yes --decrypt --passphrase="${{ secrets.FILE_PASSPHRASE }}" \
          --output android/app/google-services.json android/app/google-services.json.gpg

      # Генерация кода
      - name: Generate localization
        run: |
          dart pub global activate intl_utils
          dart pub global run intl_utils:generate

      - name: Generate code with build_runner
        run: dart run build_runner build --delete-conflicting-outputs --release

      # Сборка APK и AAB
      - name: Build APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build apk --release --dart-define-from-file=env_dart/prod.json

      - name: Build AAB for Google Play
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build appbundle --release --dart-define-from-file=env_dart/prod.json

      # Подготовка артефактов и уведомлений
      - name: Get commit info
        id: commit-info
        run: |
          echo "message=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Save release files
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk releases/android-apk-${{ steps.commit-info.outputs.sha }}.apk
          cp build/app/outputs/bundle/release/app-release.aab releases/android-aab-${{ steps.commit-info.outputs.sha }}.aab

      # Отправка уведомления в Telegram
      - name: Send Telegram notification with APK
        run: |
          # Подготовка сообщения с информацией о сборке
          MESSAGE="🤖 Android Build Completed

          Repo: ${{ github.repository }}
          Commit: ${{ steps.commit-info.outputs.sha }}
          Date: ${{ steps.commit-info.outputs.date }}
          Message: ${{ steps.commit-info.outputs.message }}
          
          📦 APK for testing attached
          📱 AAB ready for Google Play release"
          
          # Отправка текста
          curl -G \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MESSAGE" \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage
          
          # Отправка APK файла
          curl -X POST \
            -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "document=@build/app/outputs/flutter-apk/app-release.apk" \
            -F "caption=📦 APK for testing" \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument

      - name: Send AAB to Telegram
        run: |
          # Отправка AAB файла
          curl -X POST \
            -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F "document=@build/app/outputs/bundle/release/app-release.aab" \
            -F "caption=📱 AAB for Google Play Store" \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument