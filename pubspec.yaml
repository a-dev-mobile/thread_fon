name: threadfon
description: A new Flutter project.


publish_to: "none" 


version: 1.0.0+1

environment:
  sdk: ">=2.15.1 <3.0.0"


dependencies:
  auto_route: ^3.2.0
  auto_route_generator: ^3.2.0

  # Architecture
  bloc: ^8.0.3
  flutter_bloc: ^8.0.0
  hydrated_bloc: ^8.1.0
  provider: ^6.0.2
  
  

  

  # firebase
  firebase_core: ^1.12.0
  firebase_crashlytics: ^2.5.1
  flutter:
    sdk: flutter

  # localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.17.0

  # for UI
  cupertino_icons: ^1.0.2
  flutter_screenutil: ^5.4.0
  flutter_svg: ^1.0.0
  salomon_bottom_bar: ^3.2.0
  
  #  ADS
  google_mobile_ads: ^1.2.0


  # for info
  logger: ^1.1.0
  package_info_plus: ^1.4.2
  path_provider: ^2.0.8
  url_launcher: ^6.0.17


  # storage
  shared_preferences: ^2.0.13
  sqflite: ^2.0.1
  


  # helper data class
  json_annotation: ^4.4.0
  freezed_annotation: ^1.1.0
  # lints
  # more rules hard
  dart_code_metrics: ^4.14.0
  very_good_analysis: ^2.4.0
  sqflite_common_ffi: ^2.1.1

dev_dependencies:

    # helper generators
  build_runner: ^2.1.5
  
  # helper data class
  json_serializable: ^6.1.5
  freezed: ^1.1.0


  # icon splash helpers
  flutter_launcher_icons: ^0.9.2
  flutter_native_splash: ^2.1.5

  flutter_test:
    sdk: flutter



flutter:
  generate: true

  uses-material-design: true
  assets:
    - assets/
    - assets/db/
    - assets/svg/
    - assets/fonts/
    - assets/images/
    - assets/images/type_thread/
    - assets/images/m_thread/

  fonts:
    - family: montserrat
      fonts:
        - asset: assets/fonts/montserrat_light.ttf
          weight: 300
        - asset: assets/fonts/montserrat_regular.ttf
          weight: 400
        - asset: assets/fonts/montserrat_medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat_semibold.ttf
          weight: 600
        - asset: assets/fonts/montserrat_bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat_mediumitalic.ttf
          style: italic
  #

