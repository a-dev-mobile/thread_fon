name: threadfon
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.0.0+3

environment:
  sdk: ^3.5.3
  flutter: 3.24.3


dependencies:
  # Annotation
  json_annotation: ^4.9.0

  # State management
  # bloc: ^8.1.4
  flutter_bloc: ^8.1.6

  # Database
  shared_preferences: ^2.3.3
  # sqflite: ^2.3.3

  # very_good_analysis: ^6.0.0
  # sqflite_common_ffi: ^2.3.3

  intl: any
  async: any
  path: any
  meta: any
  collection: any

  # convert: any
  go_router: ^14.6.1
  google_fonts: ^6.2.1
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.3
  # Architecture
  flex_color_scheme: ^8.0.1

  # localization
  flutter_localizations:
    sdk: flutter


  # for UI

  flutter_svg: ^2.0.15
  photo_view: ^0.15.0
  font_awesome_flutter: ^10.8.0

  freezed_annotation: ^2.4.4

  # for info
  logger: ^2.5.0

  # path_provider: ^2.1.4
  url_launcher: ^6.3.1
  # retry: ^3.1.2
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.1
  firebase_core: ^3.8.0
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.5
  firebase_app_installations: ^0.3.1
dev_dependencies:
  intl_utils: ^2.8.7
  build_runner: ^2.4.13
  json_serializable:
    ^6.9.0

  flutter_gen_runner: ^5.8.0
  # Linting
  flutter_lints: ^5.0.0
  freezed: ^2.5.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/svg/
    - assets/png/
flutter_intl:
  enabled: true
  class_name: GeneratedLocalization
  main_locale: en
  arb_dir: lib/localization
  output_dir: lib/localization/generated
  use_deferred_loading: false

flutter_gen:
  output: lib/core/constant
  line_length: 120


flutter_native_splash:
  color: "#042a49" # Задайте желаемый цвет фона
  image: assets/png/icon.png
  android_12:
    image: assets/png/icon.png
    icon_background_color: "#042a49"

