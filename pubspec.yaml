name: threadfon
description: A new Flutter project.

publish_to: "none"

version: 3.0.0+40

environment:
  sdk: ^3.8.0



dependencies:
  # Annotation
  json_annotation: ^4.9.0

  # State management
  # bloc: ^8.1.4
  flutter_bloc: ^9.1.1




  shared_preferences: ^2.5.3

  intl: any
  async: any
  path: any
  meta: any
  collection: any

  # convert: any
  go_router: ^16.0.0
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  # Architecture
  flex_color_scheme: ^8.2.0

  # localization
  flutter_localizations:
    sdk: flutter


  # for UI

  flutter_svg: ^2.2.0
  photo_view: ^0.15.0
  font_awesome_flutter: ^10.8.0

  freezed_annotation: ^3.1.0

  # for info
  logger: ^2.6.1

  # path_provider: ^2.1.4
  url_launcher: ^6.3.2
  # retry: ^3.1.2
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  package_info_plus: ^8.3.0
  device_info_plus: ^11.5.0
  crypto: ^3.0.6
  firebase_core: ^3.15.2
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10
  firebase_app_installations: ^0.3.3
dev_dependencies:
  intl_utils: ^2.8.11
  build_runner: ^2.6.0
  json_serializable:
    ^6.10.0

  flutter_gen_runner: ^5.11.0
  # Linting
  flutter_lints: ^6.0.0
  freezed: ^3.2.0
  flutter_launcher_icons: ^0.14.4
  dart_code_metrics_presets: ^2.24.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/svg/
    - assets/png/
    - assets/fonts/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic
        - asset: assets/fonts/Montserrat-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/Montserrat-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Montserrat-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/Montserrat-ThinItalic.ttf
          weight: 100
          style: italic

flutter_intl:
  enabled: true
  class_name: GeneratedLocalization
  main_locale: en
  arb_dir: lib/localization
  output_dir: lib/localization/generated
  use_deferred_loading: false

flutter_gen:
  output: lib/core/constant
  line_length: 120

# dart run flutter_native_splash:create
flutter_native_splash:

  color: "#272D34" # Задайте желаемый цвет фона
  image: assets/png/icon.png
  android_12:
    image: assets/png/icon.png
    icon_background_color: "#272D34"

           # Цвет фона для iOS



# flutter pub get && dart run flutter_launcher_icons

flutter_launcher_icons:
  ios: true
  image_path: "assets/png/icon_ios.png"
  # image_path_ios: "assets/icon/icon.png"
  remove_alpha_channel_ios: true
  # image_path_ios_dark_transparent: "assets/icon/icon_dark.png"
  # image_path_ios_tinted_grayscale: "assets/icon/icon_tinted.png"
  # desaturate_tinted_to_grayscale_ios: true
